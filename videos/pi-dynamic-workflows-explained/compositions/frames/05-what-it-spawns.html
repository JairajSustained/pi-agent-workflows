  <script>
    (function () {
      "use strict";

      var root = document.getElementById("root");
      var tl = gsap.timeline({ paused: true });

      var edges = gsap.utils.toArray(root.querySelectorAll(".f05-edge"));
      var heads = gsap.utils.toArray(root.querySelectorAll(".f05-head"));
      var lines = gsap.utils.toArray(root.querySelectorAll(".f05-ln"));
      var tags = gsap.utils.toArray(root.querySelectorAll(".f05-tag-t"));

      // Every edge draws from its own measured length — never a guessed number.
      // The measured offset is kept so each draw is an explicit fromTo (correct at
      // t=0 and on every seek, never dependent on when a `to` first renders).
      var edgeLen = edges.map(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len + " " + len;
        p.style.strokeDashoffset = String(len);
        return len;
      });

      // The pane and kicker are the held stage (shared with frames 4–7), so they are
      // present at t=0 — the frame never opens blank. Only the code inside reveals.
      tl.fromTo(".f05-rail", { opacity: 0 }, { opacity: 0.72, duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo(".f05-surface", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

      // Scene 1 — the code fills the pane line by line, then the agent(...) call
      // takes the coral underline as the reading beat lands on it.
      tl.fromTo(
        lines,
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out", stagger: 0.08 },
        0.05
      );
      tl.fromTo(".f05-copy-a", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.6);      tl.fromTo(
        ".f05-hl-bar",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        1.75
      );

      // Scene 2 — the hub seats, then three edges draw on to three workers; each
      // worker pops as its own edge lands, and its clean-context tag follows.
      tl.fromTo(
        ".f05-hub-g",
        { opacity: 0, scale: 0, svgOrigin: "150 298" },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        2.0
      );

      var inHalves = [
        { draw: 2.45, edge: 0, head: 0, dur: 0.55 },
        { draw: 2.75, edge: 1, head: 1, dur: 0.55 },
        { draw: 3.05, edge: 2, head: 2, dur: 0.55 }
      ];
      inHalves.forEach(function (s, i) {
        tl.fromTo(
          edges[s.edge],
          { strokeDashoffset: edgeLen[s.edge] },
          { strokeDashoffset: 0, duration: s.dur, ease: "power2.out" },
          s.draw
        );
        tl.fromTo(heads[s.head], { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, s.draw + s.dur);
      });

      var workerGroups = [".f05-w1-g", ".f05-w2-g", ".f05-w3-g"];
      var workerOrigins = ["590 108", "590 298", "590 488"];
      var workerStarts = [3.05, 3.35, 3.65];
      workerGroups.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0, scale: 0, svgOrigin: workerOrigins[i] },
          { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
          workerStarts[i]
        );
      });
      tl.fromTo(
        tags,
        { opacity: 0, y: 5 },
        { opacity: 0.62, y: 0, duration: 0.34, ease: "power2.out", stagger: 0.18 },
        3.6
      );

      // Scene 3 — the three workers converge on one variable; the convergence
      // carries the frame's single coral bloom.
      var outHalves = [
        { draw: 5.6, edge: 3, head: 3, dur: 0.6 },
        { draw: 5.78, edge: 4, head: 4, dur: 0.6 },
        { draw: 5.96, edge: 5, head: 5, dur: 0.6 }
      ];
      outHalves.forEach(function (s) {
        tl.fromTo(
          edges[s.edge],
          { strokeDashoffset: edgeLen[s.edge] },
          { strokeDashoffset: 0, duration: s.dur, ease: "power2.out" },
          s.draw
        );
        tl.fromTo(heads[s.head], { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, s.draw + s.dur);
      });
      tl.fromTo(
        ".f05-collect-g",
        { opacity: 0, scale: 0, svgOrigin: "1035 298" },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },

        { opacity: 0.32, scale: 1, duration: 0.85, ease: "power2.out" },
        6.45
      );

      // Scene 4 — the legend reads out and the coral claim lands; then the frame

      tl.fromTo(".f05-legend", { opacity: 0, y: 8 }, { opacity: 0.6, y: 0, duration: 0.4, ease: "power2.out" }, 7.4);
      tl.fromTo(
