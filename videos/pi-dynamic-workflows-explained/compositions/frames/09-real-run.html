  <script>
    (function () {
      "use strict";

      var FPS = 30;
      var root = document.getElementById("root");
      var tl = gsap.timeline({ paused: true });
      var countEase = gsap.parseEase("power2.inOut");

      // counting-dynamic-scale: the value eases A→B while transform scale grows
      // to the final size (font-size stays static; only the transform animates).
      // Every integer is precomputed at 30fps and applied with tl.set, so any
      // seek — including a reverse seek — shows the same value with no reflow.
      function countRows(from, to, duration) {
        var steps = Math.max(1, Math.round(duration * FPS));
        var rows = [];
        for (var i = 0; i <= steps; i += 1) {
          var eased = countEase(i / steps);
          rows.push(Math.round(from + (to - from) * eased).toLocaleString("en-US"));
        }
        return rows;
      }

      function scheduleCount(element, from, to, duration, at) {
        var rows = countRows(from, to, duration);
        var span = Math.max(1, rows.length - 1);
        element.textContent = rows[0];
        rows.forEach(function (row, i) {
          tl.set(element, { textContent: row }, at + duration * (i / span));
        });
      }

      // ── Scene 1 (0.0–2.6s): the record seats, its five mono rows reveal in order
      tl.fromTo(".f09-kicker",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);

      tl.fromTo(".f09-card",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);

      gsap.utils.toArray(".f09-row").forEach(function (row, i) {
        tl.fromTo(row,
          { opacity: 0, x: -10 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.55 + i * 0.42);
      });

      // `complete` lands in the preset's success tone with a restrained settle
      tl.fromTo(".f09-status",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 1.55);

      // chrome that establishes the right column early (quiet, not payload)
      tl.fromTo(".f09-sidehead",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9);

      tl.fromTo(".f09-copy",
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.9);

      // ── Scene 2 (2.6–5.6s): both inputs count up to their real value
      // the columns arrive on their own beat, so the frame opens on the record
      // alone (no idle zeros sitting on canvas from t=0)
      gsap.utils.toArray(".f09-col").forEach(function (col, i) {
        tl.fromTo(col,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.42 + i * 0.16);
      });

      tl.fromTo(".f09-plus",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.55);

      tl.fromTo("#f09-n1", { scale: 0.965 }, { scale: 1, duration: 1.35, ease: "power2.out" }, 2.75);
      scheduleCount(document.getElementById("f09-n1"), 0, 22646, 1.35, 2.75);

      tl.fromTo("#f09-n2", { scale: 0.965 }, { scale: 1, duration: 1.35, ease: "power2.out" }, 3.05);
      scheduleCount(document.getElementById("f09-n2"), 0, 22646, 1.35, 3.05);

      gsap.utils.toArray(".f09-nlabel").forEach(function (label, i) {
        tl.fromTo(label,
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.7 + i * 0.3);
      });

      tl.fromTo(".f09-eq",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 4.45);

      // ── Scene 3 (5.6–7.2s): the honest total counts, lands, and holds as the focal
      tl.fromTo("#f09-total",
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 1.05, ease: "power3.out" }, 5.75);
      scheduleCount(document.getElementById("f09-total"), 0, 45330, 1.05, 5.75);

      // the one restrained landing pulse, after the count resolves
      tl.to("#f09-total", { scale: 1.025, duration: 0.13, ease: "power3.out" }, 6.8);
      tl.to("#f09-total", { scale: 1, duration: 0.13, ease: "power2.out" }, 6.93);

      tl.fromTo(".f09-unit",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.78);

      tl.fromTo(".f09-qual",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.95);

      // ── Scene 4 (7.2–9.0s): the side rail's proof lines arrive last, then hold

        tl.fromTo(line,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.25 + i * 0.4);
      });

      tl.fromTo("#f09-real",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.05);

      gsap.utils.toArray("[data-f09-proof]").forEach(function (line, i) {
        tl.fromTo(line,
          { opacity: 0, y: 6 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.15 + i * 0.2);
      });

      // held read to the cut — no exit tween (the root transition owns the exit)
      tl.seek(0);
      window.__timelines["09-real-run"] = tl;
    })();
