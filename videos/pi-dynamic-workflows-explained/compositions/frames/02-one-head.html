    /* ---- the note lines (reading ramp) ---- */
    .oh-note {

    .oh-noteline { display: block; }
    .oh-noteland {

    /* ---- the strip that settles the beat (display) ---- */

    }
  </style>

  <div data-hf-id="hf-xxpf" id="root" data-composition-id="02-one-head" data-start="0" data-duration="8.5" data-width="1920" data-height="1080">
    <div data-hf-id="hf-klcc" class="clip" data-start="0" data-duration="8.5" data-track-index="0" style="background:#FAF9F5"></div>

    <div data-hf-id="hf-3g66" class="oh-kicker"><span data-hf-id="hf-4fgo" class="oh-spike">✱</span> 02 · the ceiling</div>

    <svg data-hf-id="hf-8dcv" class="oh-outline" width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
      <rect data-hf-id="hf-2598" id="02-one-head-outline" x="0.5" y="0.5" width="899" height="559" rx="12" />
    </svg>

    <div data-hf-id="hf-odu9" class="oh-box">
      <span data-hf-id="hf-l6pv" class="oh-boxlabel" id="02-one-head-boxlabel">context window</span>
      <div data-hf-id="hf-o525" class="oh-card" id="02-one-head-card-1">audit result — auth module</div>
      <div data-hf-id="hf-bhlp" class="oh-card" id="02-one-head-card-2">audit result — billing module</div>
      <div data-hf-id="hf-q5wt" class="oh-card" id="02-one-head-card-3">audit result — jobs module</div>
      <div data-hf-id="hf-sbzg" class="oh-card" id="02-one-head-card-4">verification notes</div>
      <div data-hf-id="hf-bvu9" class="oh-card" id="02-one-head-card-5">findings, refutations, retries…</div>

      <line data-hf-id="hf-f7cj" id="02-one-head-tick-3" x1="58" y1="185" x2="20" y2="185" />
    </svg>

    <div data-hf-id="hf-t5v2" class="oh-dots">
      <div data-hf-id="hf-ro92" class="oh-dot oh-dot-1" id="02-one-head-dot-1"></div>
      <div data-hf-id="hf-33b8" class="oh-dot oh-dot-2" id="02-one-head-dot-2"></div>

      <div data-hf-id="hf-jtib" class="oh-arrowrow" id="02-one-head-turn-1"><span data-hf-id="hf-83k6">ask</span><span data-hf-id="hf-n2sl" class="oh-glyph">→</span></div>
      <div data-hf-id="hf-b5mg" class="oh-arrowrow" id="02-one-head-turn-2"><span data-hf-id="hf-5gzw">wait</span><span data-hf-id="hf-ogft" class="oh-glyph">→</span></div>
      <div data-hf-id="hf-bxa9" class="oh-arrowrow" id="02-one-head-turn-3"><span data-hf-id="hf-4nua">ask again</span><span data-hf-id="hf-pncw" class="oh-glyph">→</span></div>
    </div>

    <div data-hf-id="hf-y1we" class="oh-note">
      <span data-hf-id="hf-et4v" class="oh-noteline" id="02-one-head-note-1">One context window.</span>
      <span data-hf-id="hf-ue5c" class="oh-noteline" id="02-one-head-note-2">Turn by turn.</span>
      <span data-hf-id="hf-7rks" class="oh-noteline oh-noteland" id="02-one-head-note-3">Every result lands back in the same head.</span>
    </div>

    <div data-hf-id="hf-fl4s" class="oh-caption" id="02-one-head-caption">One head, turn by turn.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    const root = document.querySelector('[data-composition-id="02-one-head"]');

    // ---- setup: measured stroke lengths for the drawn hairlines (svg-path-draw) ----
    const outlineEl = document.getElementById("02-one-head-outline");
    const outlineLen = outlineEl.getTotalLength();
    outlineEl.style.strokeDasharray = `${outlineLen}`;
    outlineEl.style.strokeDashoffset = `${outlineLen}`;

    const tickEls = Array.from(root.querySelectorAll(".oh-ticks line"));
    const tickLen = tickEls.map((el) => {
      const len = el.getTotalLength();
      el.style.strokeDasharray = `${len}`;
      el.style.strokeDashoffset = `${len}`;
      return len;
    });

    // ---- setup: split the mono box label so it can type in, one glyph at a time ----
    const label = document.getElementById("02-one-head-boxlabel");
    const labelChars = [];
    const labelText = label.textContent;
    label.textContent = "";
    for (const ch of labelText) {
      const span = document.createElement("span");
      span.className = "oh-ch";
      span.textContent = ch === " " ? "\u00A0" : ch;
      label.appendChild(span);
      labelChars.push(span);
    }

    const cards = [1, 2, 3, 4, 5].map((n) => document.getElementById("02-one-head-card-" + n));
    const spill = document.getElementById("02-one-head-spill");
    const dots = [1, 2, 3].map((n) => document.getElementById("02-one-head-dot-" + n));
    const turns = [1, 2, 3].map((n) => document.getElementById("02-one-head-turn-" + n));
    const notes = [1, 2, 3].map((n) => document.getElementById("02-one-head-note-" + n));
    const caption = document.getElementById("02-one-head-caption");
    const kicker = root.querySelector(".oh-kicker");

    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0–1.2s) — the window seats itself: hairline draws on, mono label types in.
    tl.fromTo(kicker, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power3.out" }, 0);
    tl.fromTo(
      outlineEl,
      { strokeDashoffset: outlineLen },
      { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" },
      0.05,
    );
    tl.fromTo(labelChars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.022 }, 0.45);

    // Scene 2 (1.2–4.6s) — results pile in, one per beat; the last one no longer fits.
    const cardAt = [1.2, 1.65, 2.1, 2.55, 3.0];
    cards.forEach((card, i) => {
      tl.fromTo(
        card,
        { scale: 0, opacity: 0, y: 14 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        cardAt[i],
      );
    });
    // the payoff: it arrives, then physically breaks the border — the box can no longer hold it
    tl.fromTo(
      spill,
      { scale: 0, opacity: 0, y: -40 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      3.55,
    );
    tl.fromTo(spill, { y: 0 }, { y: 68, duration: 0.5, ease: "power2.inOut", immediateRender: false }, 4.1);

    // Scene 3 (4.6–6.2s) — the turns feed the window: each hairline draws in toward the box.
    const turnAt = [4.65, 5.15, 5.65];
    turnAt.forEach((at, i) => {
      tl.fromTo(
        tickEls[i],
        { strokeDashoffset: tickLen[i] },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        at,
      );
      tl.fromTo(
        dots[i],
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out", transformOrigin: "50% 50%" },
        at + 0.3,
      );
      tl.fromTo(turns[i], { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, at + 0.05);
    });

    // Scene 4 (6.2–8.0s) — the reading lands, then the strip settles and holds still.
    const noteAt = [6.25, 6.7, 7.15];
    notes.forEach((note, i) => {
      tl.fromTo(note, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, noteAt[i]);
    });
    tl.fromTo(caption, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.45);

    window.__timelines["02-one-head"] = tl;
  </script>
