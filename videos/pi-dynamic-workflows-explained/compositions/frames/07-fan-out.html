  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      var root = document.getElementById("root");
      function el(id) {
        return root.querySelector("#" + id);
      }

      var tl = gsap.timeline({ paused: true });

      // ── motion primitives ──────────────────────────────────────────────────
      // svg-path-draw: measure the geometry, make the whole path one dash, then
      // tween strokeDashoffset to 0. fromTo applies the hidden from-state at
      // build time, so the tween is correct under frame-by-frame seek.
      function draw(id, at, dur) {
        var node = el(id);
        var len = node.getTotalLength();
        node.style.strokeDasharray = len + " " + len;
        node.style.strokeDashoffset = String(len);
        tl.fromTo(node, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
        return at + dur;
      }

      // spring-pop-entrance: smooth long-tail settle, no overshoot (no bounce).
      function pop(id, at, dur, rise) {
        tl.fromTo(
          el(id),
          { opacity: 0, scale: 0.94, y: rise === undefined ? 10 : rise, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, y: 0, duration: dur, ease: "power3.out" },
          at
        );
      }

      // label reveal — same settle, no scale (type must not squash).
      function reveal(id, at, dur, rise) {
        tl.fromTo(
          el(id),
          { opacity: 0, y: rise === undefined ? 8 : rise },
          { opacity: 1, y: 0, duration: dur, ease: "power2.out" },
          at
        );
      }

      // an arrowhead lands with its edge, never before it (grows from its tip)
      function arrow(id, at) {
        tl.fromTo(
          el(id),
          { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" },
          { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
          at
        );
      }

      function fadeIn(id, at, dur, to) {
        tl.fromTo(el(id), { opacity: 0 }, { opacity: to === undefined ? 1 : to, duration: dur, ease: "power2.out" }, at);
      }

      // dim a solid stroke once its dashed register has resolved over it
      function settleTo(id, at, dur, to) {
        tl.fromTo(el(id), { opacity: 1 }, { opacity: to, duration: dur, ease: "power2.out" }, at);
      }

      // ══ Scene 1 (0.0–3.2s) — panel A builds: source, three agents, all onto the barrier
      reveal("f07-rail", 0, 0.35, 6);
      pop("f07-a-src", 0.05, 0.35, 8); // hero on screen by 0.40s
      reveal("f07-a-head-fn", 0.10, 0.4, 8);
      reveal("f07-a-head-desc", 0.26, 0.4, 8);

      // source → agent edges, staggered (each starts ~70% into the previous draw)
      draw("f07-a-e1", 0.55, 0.5);
      draw("f07-a-e2", 0.90, 0.5);
      draw("f07-a-e3", 1.25, 0.5);
      arrow("f07-a-h1", 1.03);
      arrow("f07-a-h2", 1.38);
      arrow("f07-a-h3", 1.73);
      pop("f07-a-n1", 1.03, 0.4, 8);
      pop("f07-a-n2", 1.38, 0.4, 8);
      pop("f07-a-n3", 1.73, 0.4, 8);

      // agent → barrier edges converge inward
      draw("f07-a-e4", 1.95, 0.4);
      draw("f07-a-e5", 2.10, 0.4);
      draw("f07-a-e6", 2.25, 0.4);
      arrow("f07-a-h4", 2.33);
      arrow("f07-a-h5", 2.48);
      arrow("f07-a-h6", 2.63);

      // the barrier draws on, then resolves into its dashed register
      draw("f07-a-bar-solid", 2.70, 0.5);
      fadeIn("f07-a-bar-dash", 3.14, 0.3, 1);
      settleTo("f07-a-bar-solid", 3.14, 0.3, 0.32);
      reveal("f07-a-bar-t", 3.06, 0.35, 6);

      // ══ Scene 2 (3.2–4.6s) — the barrier is the focal: its promise, then the handoff
      reveal("f07-a-bar-sub", 3.40, 0.4, 6);
      draw("f07-a-e7", 3.70, 0.45);
      arrow("f07-a-h7", 4.13);
      pop("f07-a-synth", 4.14, 0.42, 8);

      // ══ Scene 3 (4.6–7.4s) — panel B builds: bands, items in flight, the moving chain
      reveal("f07-b-head-fn", 4.70, 0.4, 8);
      reveal("f07-b-head-desc", 4.86, 0.4, 8);

      draw("f07-b-band1-solid", 5.05, 0.45);
      draw("f07-b-band2-solid", 5.22, 0.45);
      fadeIn("f07-b-band1-dash", 5.48, 0.28, 1);
      fadeIn("f07-b-band2-dash", 5.65, 0.28, 1);
      settleTo("f07-b-band1-solid", 5.48, 0.28, 0.5);
      settleTo("f07-b-band2-solid", 5.65, 0.28, 0.5);
      reveal("f07-b-band1-t", 5.34, 0.32, 5);
      reveal("f07-b-band2-t", 5.51, 0.32, 5);

      pop("f07-b-itemC", 5.75, 0.4, 8);
      pop("f07-b-itemB", 6.05, 0.4, 8);
      pop("f07-b-itemA", 6.35, 0.4, 8);

      draw("f07-b-e1", 6.55, 0.3);
      fadeIn("f07-b-e1-dash", 6.84, 0.24, 1);
      settleTo("f07-b-e1", 6.84, 0.24, 0.45);
      draw("f07-b-e2", 6.85, 0.3);
      draw("f07-b-e3", 7.05, 0.3);
      arrow("f07-b-h1", 6.83);
      arrow("f07-b-h2", 7.13);
      arrow("f07-b-h3", 7.33);
      pop("f07-b-result", 7.20, 0.38, 8);

      // ══ Scene 4 (7.4–9.0s) — the read, then stillness
      reveal("f07-foot", 7.72, 0.45, 8);
      reveal("f07-copy", 7.96, 0.45, 8);
      // 8.4s → 9.0s: the resolved frame holds. Nothing moves.

      window.__timelines["07-fan-out"] = tl;
    })();
  </script>
