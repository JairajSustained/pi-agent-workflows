  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "04-the-script";
      var FONT_SIZE = 26;
      var LINE_H = 39;          // 26px * 1.5
      var CH = FONT_SIZE * 0.6; // JetBrains Mono advance = 0.6em — exact, so no DOM measurement is needed

      // Source of truth for the typed content: [ [text, className], ... ] per line.
      // Rendered by hand-set mono (frame.md: keywords dimmed cream, strings teal) — the one
      // coral moment in this frame is reserved for the agent(...) highlight below.
      var CODE = [
        [["const", "hf04-dim"], [" meta = {", ""]],
        [["  name: ", ""], ["'audit'", "hf04-str"], [",", ""]],
        [["  phases: [{ title: ", ""], ["'Scan'", "hf04-str"], [" }, { title: ", ""], ["'Challenge'", "hf04-str"], [" }],", ""]],
        [["};", ""]],
        [],
        [["phase(", ""], ["'Scan'", "hf04-str"], [");", ""]],
        [["const", "hf04-dim"], [" findings = ", ""], ["await", "hf04-dim"], [" parallel(", ""]],
        [["  args.areas.map((area) => () =>", ""]],
        [["    agent(", ""], ["\u0060Audit ${area}.\u0060", "hf04-str"], [", {", ""]],
        [["      label: ", ""], ["\u0060scan-${area}\u0060", "hf04-str"], [",", ""]],
        [["      schema: ", ""], ["'json'", "hf04-str"], [",", ""]],
        [["    })", ""]],
        [["  ),", ""]],
        [[");", ""]]
      ];

      // ── build the code DOM: every character is its own inline-block span ─────
      var pre = document.getElementById("hf04-pre");
      var chars = []; // { el, line, col }
      for (var li = 0; li < CODE.length; li++) {
        var lineEl = document.createElement("div");
        lineEl.className = "hf04-ln";
        var col = 0;
        var segs = CODE[li];
        for (var si = 0; si < segs.length; si++) {
          var text = segs[si][0];
          var cls = segs[si][1];
          for (var ci = 0; ci < text.length; ci++) {
            var span = document.createElement("span");
            span.className = "hf04-ch" + (cls ? " " + cls : "");
            span.textContent = text.charAt(ci);
            lineEl.appendChild(span);
            chars.push({ el: span, line: li, col: col });
            col++;
          }
        }
        pre.appendChild(lineEl);
      }
      var lineLen = CODE.map(function (segs) {
        return segs.reduce(function (n, s) { return n + s[0].length; }, 0);
      });

      var caret = document.getElementById("hf04-caret");
      var hlbar = document.getElementById("hf04-hlbar");
      var bloom = document.getElementById("hf04-bloom");

      // Coral highlight sits under the agent(...) call — line index 8.
      var HL_LINE = 8;
      hlbar.style.top = HL_LINE * LINE_H + LINE_H - 7 + "px";
      hlbar.style.width = lineLen[HL_LINE] * CH + "px";
      bloom.style.top = HL_LINE * LINE_H + LINE_H / 2 - 75 + "px";

      var tl = gsap.timeline({ paused: true });

      // deterministic idle blink — a finite list of explicit opacity toggles
      // (no looping directives anywhere, so the timeline stays seek-safe).
      // Always ends with the caret visible so the next typing run starts solid.
      function blink(from, dur, period) {
        var end = from + dur;
        var t = from;
        var on = false;
        while (t < end - 0.02) {
          tl.set(caret, { opacity: on ? 1 : 0 }, t);
          on = !on;
          t += period * 0.5;
        }
        tl.set(caret, { opacity: 1 }, end - 0.02);
      }

      // type a run of characters at a fixed cadence; caret tracks the frontier
      function type(from, list, dt, linePause) {
        var t = from;
        for (var i = 0; i < list.length; i++) {
          var c = list[i];
          tl.set(c.el, { opacity: 1 }, t);
          tl.set(caret, { x: (c.col + 1) * CH, y: c.line * LINE_H + (LINE_H - 26) / 2, opacity: 1 }, t);
          t += dt;
          if (linePause && i < list.length - 1 && list[i + 1].line !== c.line) t += linePause;
        }
        return t;
      }
      function charsOf(lines) {
        return chars.filter(function (c) { return lines.indexOf(c.line) !== -1; });
      }
      function revealGroup(from, list, dt) { // "arrives as a unit": very tight stagger
        for (var i = 0; i < list.length; i++) tl.set(list[i].el, { opacity: 1 }, from + i * dt);
      }

      // ── t=0 state: supporting layers hidden (deterministic, seek-safe) ───────
      gsap.set(chars.map(function (c) { return c.el; }), { opacity: 0 });
      gsap.set([caret, bloom, hlbar], { opacity: 0 });
      gsap.set(hlbar, { scaleX: 0 });
      gsap.set("#hf04-rail", { opacity: 0 });
      gsap.set("#hf04-side", { opacity: 0 });
      gsap.set(["#hf04-claim1", "#hf04-claim2", "#hf04-rule", "#hf04-slot1", "#hf04-slot2", "#hf04-slot3"], { opacity: 0 });
      gsap.set(["#hf04-cue1", "#hf04-cue2"], { opacity: 0 });
      gsap.set("#hf04-rule", { scaleX: 0 });

      // ── Scene 1 (0.0–3.2s): the surface seats, then `meta` types ─────────────
      tl.fromTo("#hf04-swell", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
      tl.fromTo("#hf04-surface", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.02);
      tl.fromTo("#hf04-rail", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.1);
      tl.fromTo("#hf04-side", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.16);
      // meta block types in, one character at a time, with a breath at each line end
      type(0.45, charsOf([0, 1, 2, 3]), 0.026, 0.14);           // ends ~3.15
      blink(3.16, 0.28, 0.53);

      // ── Scene 2 (3.2–5.6s): phase types, then the parallel call lands whole ──
      tl.fromTo("#hf04-cue1", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.out" }, 3.3);
      type(3.45, charsOf([5]), 0.03, 0);                          // phase('Scan')  → ~3.9
      blink(3.91, 0.24, 0.53);
      revealGroup(4.18, charsOf([6]), 0.012);                     // arrives as a unit, not typed
      blink(4.6, 0.95, 0.53);

      // ── Scene 3 (5.6–7.6s): the agent() call types, then takes the coral mark ─
      var afterArgs = type(5.65, charsOf([7]), 0.022, 0);         //  → ~6.35
      var afterCall = type(afterArgs, charsOf([8]), 0.022, 0);    //  → ~7.0
      // the focal beat: coral underline draws on + one restrained bloom; the caret
      // hands the coral over to the highlight and leaves.
      tl.fromTo(hlbar, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 0.9, duration: 0.24, ease: "power2.out" }, afterCall + 0.02);
      tl.fromTo(bloom, { opacity: 0 }, { opacity: 0.28, duration: 0.38, ease: "power1.out" }, afterCall + 0.02);
      tl.to(caret, { opacity: 0, duration: 0.18, ease: "power1.in" }, afterCall + 0.04);

      // ── Scene 4 (7.6–9.0s): the claim, the rule, the legend — then hold ──────
      tl.fromTo("#hf04-cue2", { opacity: 0 }, { opacity: 1, duration: 0.32, ease: "power1.out" }, 6.45);
      tl.fromTo("#hf04-claim1", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.8);
      tl.fromTo("#hf04-claim2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.06);

      window.__timelines = window.__timelines || {};

    })();
